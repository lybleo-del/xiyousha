name: Deploy to GitHub Pages

# 把站点发布到 GitHub Pages。
# 一次性设置：仓库 Settings → Pages → Build and deployment → Source 选 "GitHub Actions"。
# 之后推送到本分支会自动部署。

# 说明：本工作流仅在你把 Settings → Pages → Source 设为 "GitHub Actions" 后才能成功。
# 若你用更简单的「Deploy from a branch」方式发布，则无需本工作流，可忽略它。
# 改为手动触发，避免在 Pages 未启用时每次推送都失败。
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
